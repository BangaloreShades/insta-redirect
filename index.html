<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Instagram...</title>
  <script>
    const appUrl = "instagram://user?username=bangaloreshades";
    const webUrl = "https://www.instagram.com/bangaloreshades/";

    // 1. Attempt to launch the native Instagram app directly
    window.location.href = appUrl;

    // 2. Fall back to the web link if the app fails to open within 1.5s
    setTimeout(function () {
      window.location.replace(webUrl);
    }, 1500);
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding-top: 60px;">
  <p>Opening Instagram profile...</p>
  <p style="color: #666; font-size: 14px;">
    If the app does not open automatically, 
    <a href="https://www.instagram.com/bangaloreshades/">click here to open in browser</a>.
  </p>
</body>
</html>
